<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="boxGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 24px; font-weight: 700; fill: #f8fafc; }
    .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; fill: #94a3b8; }
    .box-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #ffffff; }
    .box-desc { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #e2e8f0; }
    .arrow-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: #fcd34d; }
  </style>

  <!-- Background -->
  <rect width="1000" height="450" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="960" height="410" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Header -->
  <text x="50" y="60" class="title">كيف يعمل المشروع؟ (Workflow Diagram)</text>
  <text x="50" y="85" class="subtitle">خطوات عمل نظام تشغيل التلفزيون التلقائي عند عودة الكهرباء</text>

  <!-- Step 1: Power Restored -->
  <g filter="url(#dropShadow)" transform="translate(50, 150)">
    <rect width="180" height="120" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2" />
    <rect width="180" height="40" rx="12" fill="url(#boxGrad1)" />
    <rect y="30" width="180" height="10" fill="url(#boxGrad1)" />
    <text x="90" y="25" class="box-title" text-anchor="middle">1. عودة الكهرباء</text>
    <text x="90" y="70" class="box-desc" text-anchor="middle">يعود التيار الكهربائي</text>
    <text x="90" y="90" class="box-desc" text-anchor="middle">للمنزل بعد انقطاعه.</text>
    <text x="90" y="110" class="box-desc" text-anchor="middle">(Power Restored)</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 230 210 L 290 210" fill="none" stroke="#fcd34d" stroke-width="3" stroke-dasharray="5,5" />
  <polygon points="290,205 300,210 290,215" fill="#fcd34d" />
  <text x="265" y="200" class="arrow-text" text-anchor="middle">طاقة 5V</text>

  <!-- Step 2: ESP32 Boots -->
  <g filter="url(#dropShadow)" transform="translate(300, 150)">
    <rect width="180" height="120" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <rect width="180" height="40" rx="12" fill="url(#boxGrad2)" />
    <rect y="30" width="180" height="10" fill="url(#boxGrad2)" />
    <text x="90" y="25" class="box-title" text-anchor="middle">2. إقلاع الشريحة</text>
    <text x="90" y="70" class="box-desc" text-anchor="middle">تعمل شريحة ESP32</text>
    <text x="90" y="90" class="box-desc" text-anchor="middle">وتنتظر 15 ثانية لجاهزية</text>
    <text x="90" y="110" class="box-desc" text-anchor="middle">لوحة التلفزيون.</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 480 210 L 540 210" fill="none" stroke="#fcd34d" stroke-width="3" stroke-dasharray="5,5" />
  <polygon points="540,205 550,210 540,215" fill="#fcd34d" />
  <text x="515" y="200" class="arrow-text" text-anchor="middle">أمر CEC</text>

  <!-- Step 3: CEC Command -->
  <g filter="url(#dropShadow)" transform="translate(550, 150)">
    <rect width="180" height="120" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <rect width="180" height="40" rx="12" fill="url(#boxGrad3)" />
    <rect y="30" width="180" height="10" fill="url(#boxGrad3)" />
    <text x="90" y="25" class="box-title" text-anchor="middle">3. إرسال الأوامر</text>
    <text x="90" y="70" class="box-desc" text-anchor="middle">ترسل الشريحة أمر</text>
    <text x="90" y="90" class="box-desc" text-anchor="middle">&lt;Image View On&gt;</text>
    <text x="90" y="110" class="box-desc" text-anchor="middle">عبر كابل الـ HDMI.</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 730 210 L 790 210" fill="none" stroke="#fcd34d" stroke-width="3" stroke-dasharray="5,5" />
  <polygon points="790,205 800,210 790,215" fill="#fcd34d" />
  <text x="765" y="200" class="arrow-text" text-anchor="middle">استجابة</text>

  <!-- Step 4: TV Turns On -->
  <g filter="url(#dropShadow)" transform="translate(800, 150)">
    <rect width="150" height="120" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" />
    <rect width="150" height="40" rx="12" fill="url(#boxGrad4)" />
    <rect y="30" width="150" height="10" fill="url(#boxGrad4)" />
    <text x="75" y="25" class="box-title" text-anchor="middle">4. تشغيل الشاشة</text>
    <text x="75" y="70" class="box-desc" text-anchor="middle">يستقبل التلفزيون</text>
    <text x="75" y="90" class="box-desc" text-anchor="middle">الأمر ويعمل تلقائياً</text>
    <text x="75" y="110" class="box-desc" text-anchor="middle">بدون تدخل بشري!</text>
  </g>

  <!-- Footer -->
  <rect x="50" y="320" width="900" height="80" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <text x="500" y="355" class="box-title" text-anchor="middle" fill="#38bdf8">نتيجة نهائية (Final Result)</text>
  <text x="500" y="375" class="box-desc" text-anchor="middle">بمجرد توصيل الكهرباء، سيتم إيقاظ التلفزيون وتحويل مدخل العرض إلى جهازك بشكل تلقائي.</text>

</svg>
