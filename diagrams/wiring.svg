<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <linearGradient id="hdmiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="espGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="rtcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 24px; font-weight: 700; fill: #f8fafc; }
    .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 14px; fill: #94a3b8; }
    .card-title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #ffffff; }
    .pin-label { font-family: 'Consolas', monospace, monospace; font-size: 13px; font-weight: 600; fill: #f1f5f9; }
    .note-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 12px; fill: #cbd5e1; }
    .legend-title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #f8fafc; }
    .legend-desc { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 11px; fill: #94a3b8; }
  </style>

  <!-- Background -->
  <rect width="1000" height="650" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="960" height="610" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Header -->
  <text x="50" y="60" class="title">ESP32 HDMI-CEC TV Autostart - Wiring Diagram</text>
  <text x="50" y="85" class="subtitle">Complete Pin-to-Pin Hardware Interconnections &amp; Schematic</text>

  <!-- ==================== HDMI CONNECTOR CARD ==================== -->
  <g filter="url(#dropShadow)">
    <rect x="50" y="130" width="250" height="340" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <rect x="50" y="130" width="250" height="45" rx="12" fill="url(#hdmiGrad)" />
    <rect x="50" y="165" width="250" height="10" fill="url(#hdmiGrad)" />
    <text x="175" y="160" class="card-title" text-anchor="middle">HDMI Male (TV)</text>

    <!-- Pins inside HDMI card -->
    <!-- Pin 18: +5V -->
    <rect x="70" y="200" width="210" height="42" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1.5" />
    <text x="85" y="226" class="pin-label" fill="#ef4444">Pin 18 (+5V Power)</text>

    <!-- Pin 13: CEC -->
    <rect x="70" y="260" width="210" height="42" rx="6" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="85" y="286" class="pin-label" fill="#a78bfa">Pin 13 (CEC Line)</text>

    <!-- Pin 17: GND -->
    <rect x="70" y="320" width="210" height="42" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1.5" />
    <text x="85" y="346" class="pin-label" fill="#cbd5e1">Pin 17 (DDC/CEC GND)</text>

    <!-- Pin 19: HPD (Optional) -->
    <rect x="70" y="380" width="210" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="85" y="406" class="pin-label" fill="#64748b">Pin 19 (Hot Plug / N.C.)</text>
  </g>

  <!-- ==================== ESP32 MICROCONTROLLER CARD ==================== -->
  <g filter="url(#dropShadow)">
    <rect x="375" y="130" width="250" height="340" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <rect x="375" y="130" width="250" height="45" rx="12" fill="url(#espGrad)" />
    <rect x="375" y="165" width="250" height="10" fill="url(#espGrad)" />
    <text x="500" y="160" class="card-title" text-anchor="middle">ESP32 (DevKit / C3)</text>

    <!-- VIN / 5V -->
    <rect x="395" y="200" width="210" height="36" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1.5" />
    <text x="410" y="223" class="pin-label" fill="#fca5a5">VIN / 5V Pin</text>

    <!-- GPIO4 / GPIO3 (CEC) -->
    <rect x="395" y="248" width="210" height="36" rx="6" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="410" y="271" class="pin-label" fill="#d8b4fe">GPIO4 (DevKit) / GPIO3 (C3)</text>

    <!-- GND -->
    <rect x="395" y="296" width="210" height="36" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1.5" />
    <text x="410" y="319" class="pin-label" fill="#cbd5e1">GND Pin</text>

    <!-- I2C SDA -->
    <rect x="395" y="344" width="210" height="36" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
    <text x="410" y="367" class="pin-label" fill="#fde047">GPIO21 (SDA) / GPIO8 (C3)</text>

    <!-- I2C SCL -->
    <rect x="395" y="392" width="210" height="36" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
    <text x="410" y="415" class="pin-label" fill="#67e8f9">GPIO22 (SCL) / GPIO9 (C3)</text>
  </g>

  <!-- ==================== DS3231 RTC MODULE CARD ==================== -->
  <g filter="url(#dropShadow)">
    <rect x="700" y="130" width="250" height="340" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <rect x="700" y="130" width="250" height="45" rx="12" fill="url(#rtcGrad)" />
    <rect x="700" y="165" width="250" height="10" fill="url(#rtcGrad)" />
    <text x="825" y="160" class="card-title" text-anchor="middle">DS3231 RTC (CR2032)</text>

    <!-- VCC (3.3V) -->
    <rect x="720" y="200" width="210" height="36" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1.5" />
    <text x="735" y="223" class="pin-label" fill="#fca5a5">VCC (3.3V from ESP32)</text>

    <!-- GND -->
    <rect x="720" y="248" width="210" height="36" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1.5" />
    <text x="735" y="271" class="pin-label" fill="#cbd5e1">GND</text>

    <!-- SDA -->
    <rect x="720" y="296" width="210" height="36" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
    <text x="735" y="319" class="pin-label" fill="#fde047">SDA</text>

    <!-- SCL -->
    <rect x="720" y="344" width="210" height="36" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
    <text x="735" y="367" class="pin-label" fill="#67e8f9">SCL</text>

    <!-- Battery info box -->
    <rect x="720" y="392" width="210" height="58" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="735" y="415" class="pin-label" fill="#38bdf8">CR2032 Coin Cell</text>
    <text x="735" y="435" class="note-text">Maintains RTC clock during blackout</text>
  </g>

  <!-- ==================== CONNECTION WIRES ==================== -->
  <!-- Wire 1: HDMI Pin 18 (5V) -> ESP32 VIN (RED) -->
  <path d="M 280 221 L 395 221" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
  <circle cx="280" cy="221" r="4" fill="#ef4444" />
  <circle cx="395" cy="221" r="4" fill="#ef4444" />

  <!-- Wire 2: HDMI Pin 13 (CEC) -> 2.7k Ohm Resistor -> ESP32 CEC GPIO (PURPLE) -->
  <path d="M 280 281 L 315 281" fill="none" stroke="#8b5cf6" stroke-width="3" />
  <!-- Resistor symbol box -->
  <rect x="315" y="271" width="45" height="20" rx="3" fill="#1e1b4b" stroke="#a78bfa" stroke-width="2" />
  <text x="337" y="285" font-family="'Consolas', monospace" font-size="10" font-weight="bold" fill="#f5d0fe" text-anchor="middle">2.7kΩ</text>
  <path d="M 360 281 L 375 281 L 375 266 L 395 266" fill="none" stroke="#8b5cf6" stroke-width="3" />
  <circle cx="280" cy="281" r="4" fill="#8b5cf6" />
  <circle cx="395" cy="266" r="4" fill="#8b5cf6" />

  <!-- Wire 3: HDMI Pin 17 (GND) -> ESP32 GND (GRAY) -->
  <path d="M 280 341 L 350 341 L 350 314 L 395 314" fill="none" stroke="#64748b" stroke-width="3" />
  <circle cx="280" cy="341" r="4" fill="#64748b" />
  <circle cx="395" cy="314" r="4" fill="#64748b" />

  <!-- Wire 4: ESP32 3.3V -> DS3231 VCC (ORANGE/RED) -->
  <path d="M 605 218 L 720 218" fill="none" stroke="#f43f5e" stroke-width="3" />
  <circle cx="605" cy="218" r="4" fill="#f43f5e" />
  <circle cx="720" cy="218" r="4" fill="#f43f5e" />

  <!-- Wire 5: ESP32 GND -> DS3231 GND (GRAY) -->
  <path d="M 605 314 L 665 314 L 665 266 L 720 266" fill="none" stroke="#64748b" stroke-width="3" />
  <circle cx="605" cy="314" r="4" fill="#64748b" />
  <circle cx="720" cy="266" r="4" fill="#64748b" />

  <!-- Wire 6: ESP32 SDA -> DS3231 SDA (YELLOW) -->
  <path d="M 605 362 L 675 362 L 675 314 L 720 314" fill="none" stroke="#f59e0b" stroke-width="3" />
  <circle cx="605" cy="362" r="4" fill="#f59e0b" />
  <circle cx="720" cy="314" r="4" fill="#f59e0b" />

  <!-- Wire 7: ESP32 SCL -> DS3231 SCL (CYAN) -->
  <path d="M 605 410 L 685 410 L 685 362 L 720 362" fill="none" stroke="#06b6d4" stroke-width="3" />
  <circle cx="605" cy="410" r="4" fill="#06b6d4" />
  <circle cx="720" cy="362" r="4" fill="#06b6d4" />

  <!-- ==================== FOOTER NOTES & LEGEND ==================== -->
  <g filter="url(#dropShadow)">
    <rect x="50" y="495" width="900" height="110" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    
    <text x="75" y="525" class="legend-title">CRITICAL HARDWARE NOTES &amp; CURRENT LIMITATION:</text>
    <text x="75" y="548" class="note-text">1. <tspan fill="#ef4444" font-weight="bold">HDMI Pin 18 (+5V)</tspan> provides approx. 50-55mA nominal current according to the HDMI specification. ESP32-C3 Super Mini is highly recommended for lower power draw.</text>
    <text x="75" y="570" class="note-text">2. <tspan fill="#8b5cf6" font-weight="bold">2.7kΩ Resistor</tspan> protects the ESP32 GPIO pin from in-rush voltage and dampens reflections on the bidirectional 3.3V open-drain CEC line.</text>
    <text x="75" y="592" class="note-text">3. <tspan fill="#f59e0b" font-weight="bold">DS3231 CR2032 Battery</tspan> keeps accurate real-time clock ticking through long blackout periods to guarantee precise outage calculation.</text>
  </g>
</svg>
