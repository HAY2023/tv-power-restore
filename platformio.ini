; PlatformIO Project Configuration File
;
; ESP32 HDMI-CEC TV Autostart
;
; Target 1 (DEFAULT / PRIMARY): ESP32 WROOM (DevKit v1 / NodeMCU-32S)
; Target 2 (OPTIONAL / SECONDARY): ESP32-C3 Super Mini / DevKitM-1

[platformio]
default_envs = esp32dev
description = ESP32 HDMI-CEC TV Autostart after power outage

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    adafruit/RTClib @ ^2.1.4
    Wire
build_flags =
    -D CORE_DEBUG_LEVEL=3

; ==============================================================================
; PRIMARY TARGET: ESP32 WROOM (DevKit v1 / NodeMCU-32S / ESP32-WROOM-32)
; Default GPIOs: CEC=GPIO4, SDA=GPIO21, SCL=GPIO22
; ==============================================================================
[env:esp32dev]
platform = espressif32
board = esp32dev
build_flags =
    ${env.build_flags}
    -D BOARD_ESP32_DEVKIT

; ==============================================================================
; SECONDARY TARGET: ESP32-C3 Super Mini / DevKitM-1
; Default GPIOs: CEC=GPIO3, SDA=GPIO8, SCL=GPIO9
; ==============================================================================
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
build_flags =
    ${env.build_flags}
    -D BOARD_ESP32_C3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; ==============================================================================
; ADDITIONAL ESP TARGETS
; ==============================================================================
[env:esp32s2]
platform = espressif32
board = esp32-s2-saola-1
build_flags =
    ${env.build_flags}
    -D BOARD_ESP32_S2
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D BOARD_ESP32_S3
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp8266]
platform = espressif8266
board = nodemcuv2
build_flags =
    ${env.build_flags}
    -D BOARD_ESP8266

; ==============================================================================
; ARDUINO AVR TARGETS (Uno / Nano)
; ==============================================================================
[env:uno]
platform = atmelavr
board = uno
build_flags =
    ${env.build_flags}
    -D BOARD_ARDUINO_AVR

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
build_flags =
    ${env.build_flags}
    -D BOARD_ARDUINO_AVR

; ==============================================================================
; RASPBERRY PI PICO TARGET
; ==============================================================================
[env:pico]
platform = raspberrypi
board = pico
build_flags =
    ${env.build_flags}
    -D BOARD_RPI_PICO
