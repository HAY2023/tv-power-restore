name: Build & Release Firmware

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile Firmware & Export Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO and esptool
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: Build Firmware for ESP32 WROOM
        run: pio run -e esp32dev

      - name: Build Firmware for ESP32-C3
        run: pio run -e esp32c3

      - name: Build Firmware for ESP32-S2
        run: pio run -e esp32s2

      - name: Build Firmware for ESP32-S3
        run: pio run -e esp32s3

      - name: Build Firmware for ESP8266
        run: pio run -e esp8266

      - name: Build Firmware for Arduino UNO
        run: pio run -e uno

      - name: Build Firmware for Arduino Nano
        run: pio run -e nanoatmega328

      - name: Build Firmware for Raspberry Pi Pico
        run: pio run -e pico

      - name: Package Firmware Binaries & Create Merged Flash Files
        run: |
          mkdir -p release_binaries
          
          # ESP32 WROOM (offset 0x1000 for bootloader)
          esptool.py --chip esp32 merge_bin -o release_binaries/ESP32_WROOM_Firmware.bin --flash_mode dio --flash_freq 40m --flash_size 4MB 0x1000 .pio/build/esp32dev/bootloader.bin 0x8000 .pio/build/esp32dev/partitions.bin 0x10000 .pio/build/esp32dev/firmware.bin
          
          # ESP32-C3 (offset 0x0 for bootloader)
          esptool.py --chip esp32c3 merge_bin -o release_binaries/ESP32_C3_Firmware.bin --flash_mode dio --flash_freq 40m --flash_size 4MB 0x0 .pio/build/esp32c3/bootloader.bin 0x8000 .pio/build/esp32c3/partitions.bin 0x10000 .pio/build/esp32c3/firmware.bin

          # ESP32-S2 (offset 0x1000 for bootloader)
          esptool.py --chip esp32s2 merge_bin -o release_binaries/ESP32_S2_Firmware.bin --flash_mode dio --flash_freq 40m --flash_size 4MB 0x1000 .pio/build/esp32s2/bootloader.bin 0x8000 .pio/build/esp32s2/partitions.bin 0x10000 .pio/build/esp32s2/firmware.bin

          # ESP32-S3 (offset 0x0 for bootloader)
          esptool.py --chip esp32s3 merge_bin -o release_binaries/ESP32_S3_Firmware.bin --flash_mode dio --flash_freq 40m --flash_size 4MB 0x0 .pio/build/esp32s3/bootloader.bin 0x8000 .pio/build/esp32s3/partitions.bin 0x10000 .pio/build/esp32s3/firmware.bin

          # ESP8266 (Single firmware.bin)
          cp .pio/build/esp8266/firmware.bin release_binaries/ESP8266_Firmware.bin

          # Arduino (Hex files)
          cp .pio/build/uno/firmware.hex release_binaries/Arduino_Uno_Firmware.hex
          cp .pio/build/nanoatmega328/firmware.hex release_binaries/Arduino_Nano_Firmware.hex

          # Pico (UF2 file)
          cp .pio/build/pico/firmware.uf2 release_binaries/RaspberryPi_Pico_Firmware.uf2

          # Copy batch scripts for flashing
          cp حرق_السوفتوير.bat release_binaries/
          cp flash.bat release_binaries/
          
          # Convert line endings of batch scripts to CRLF to ensure Windows compatibility
          sed -i 's/$/\r/' release_binaries/حرق_السوفتوير.bat
          sed -i 's/$/\r/' release_binaries/flash.bat

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TV_Power_Restore_Firmware
          path: release_binaries/
          retention-days: 30

      - name: Create GitHub Release (On Git Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_binaries/ESP32_WROOM_Firmware.bin
            release_binaries/ESP32_C3_Firmware.bin
            release_binaries/ESP32_S2_Firmware.bin
            release_binaries/ESP32_S3_Firmware.bin
            release_binaries/ESP8266_Firmware.bin
            release_binaries/Arduino_Uno_Firmware.hex
            release_binaries/Arduino_Nano_Firmware.hex
            release_binaries/RaspberryPi_Pico_Firmware.uf2
            release_binaries/حرق_السوفتوير.bat
            release_binaries/flash.bat
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
