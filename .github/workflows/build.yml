name: Build & Release Firmware

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile Firmware & Export Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO and esptool
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: Build Firmware for ESP32 WROOM (Primary Target)
        run: |
          pio run -e esp32dev

      - name: Build Firmware for ESP32-C3 Super Mini (Secondary Target)
        run: |
          pio run -e esp32c3

      - name: Package Firmware Binaries & Create Merged Flash Files
        run: |
          mkdir -p release_binaries
          
          # Generate single merged all-in-one binary for ESP32 WROOM (flash at offset 0x0)
          esptool.py --chip esp32 merge_bin \
            -o release_binaries/ESP32_WROOM_Firmware.bin \
            --flash_mode dio \
            --flash_freq 40m \
            --flash_size 4MB \
            0x1000 .pio/build/esp32dev/bootloader.bin \
            0x8000 .pio/build/esp32dev/partitions.bin \
            0x10000 .pio/build/esp32dev/firmware.bin
          
          # Generate single merged all-in-one binary for ESP32-C3 (flash at offset 0x0)
          esptool.py --chip esp32c3 merge_bin \
            -o release_binaries/ESP32_C3_Firmware.bin \
            --flash_mode dio \
            --flash_freq 40m \
            --flash_size 4MB \
            0x0 .pio/build/esp32c3/bootloader.bin \
            0x8000 .pio/build/esp32c3/partitions.bin \
            0x10000 .pio/build/esp32c3/firmware.bin

          # Copy batch scripts for flashing
          cp حرق_السوفتوير.bat release_binaries/
          cp flash.bat release_binaries/
          
          # Convert line endings of batch scripts to CRLF to ensure Windows compatibility
          sed -i 's/$/\r/' release_binaries/حرق_السوفتوير.bat
          sed -i 's/$/\r/' release_binaries/flash.bat
          
          # Create a ZIP archive for the release
          cd release_binaries
          zip -r ../TV_Power_Restore_Firmware.zip *
          cd ..

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TV_Power_Restore_Firmware
          path: TV_Power_Restore_Firmware.zip
          retention-days: 30

      - name: Create GitHub Release (On Git Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: TV_Power_Restore_Firmware.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
